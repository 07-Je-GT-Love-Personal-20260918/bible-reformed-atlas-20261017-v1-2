name: Publish Surge mirror
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surge-production
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Publish verified static directory
        if: env.SURGE_TOKEN != ''
        run: |
          npx --yes --package=surge@0.44.6 surge dist bible-reformed-atlas-20261021-v1-4-gtstudy.surge.sh
          npx --yes --package=surge@0.44.6 surge dist bible-reformed-atlas-20261017-v1-2.surge.sh
      - name: Report missing deployment credential
        if: env.SURGE_TOKEN == ''
        run: echo 'SURGE_TOKEN repository secret must be configured for automatic publishing.'
