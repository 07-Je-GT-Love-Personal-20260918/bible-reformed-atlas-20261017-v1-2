<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTstudy 响应式布局检查</title><style>body{font:15px/1.7 system-ui;margin:20px;background:#edf2f7;color:#24354e}button,select{font:inherit;padding:9px;border:1px solid #aebed0;border-radius:8px;background:white;margin:4px}#viewport{overflow:auto;max-width:100%;border:1px solid #aebed0}iframe{display:block;border:0;height:820px;background:white}output{display:block;padding:12px;margin:12px 0;background:#fff;border-radius:8px}h1{font-size:24px}</style></head><body><h1>GTstudy · 布局验证</h1><p>开发维护页面：在独立视口内检查实际网页。正文页面不加载本检查工具。</p><label>页面 <select id="page"><option value="index.html">主页</option><option value="books/01-genesis.html">创世记</option><option value="creeds.html">信经阅读版</option><option value="gospels.html">四福音对比</option><option value="jesus-life.html">耶稣生平</option><option value="kings-chronicles.html">列王对读</option><option value="book-relations.html">统计对读</option><option value="pentateuch.html">五经</option><option value="historical-books.html">历史书</option><option value="wisdom-books.html">智慧书</option><option value="prophets.html">先知书</option><option value="epistles.html">新约书信</option><option value="study-paths.html">专题目录</option></select></label><div role="group" aria-label="检查宽度"><button data-width="320">320 px</button><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1440">1440 px</button></div><button id="check">重新检查</button><output id="result" role="status">等待载入</output><div id="viewport"><iframe id="frame" title="实际页面布局预览" width="360" src="index.html"></iframe></div><script>const frame=document.querySelector('#frame'),result=document.querySelector('#result');function check(){const d=frame.contentDocument,w=frame.contentWindow,a=d.querySelector('#tocButton'),b=d.querySelector('.reader-settings'),r=a?.getBoundingClientRect(),s=b?.getBoundingClientRect(),overlap=r&&s&&r.left<s.right&&r.right>s.left&&r.top<s.bottom&&r.bottom>s.top;result.textContent=JSON.stringify({width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth+1,controlsOverlap:Boolean(overlap),books:d.querySelectorAll('.book-card').length,theme:d.documentElement.dataset.theme,version:d.querySelector('[name="atlas-version"]')?.content})}frame.addEventListener('load',()=>{requestAnimationFrame(()=>requestAnimationFrame(check))});document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.width=b.dataset.width;requestAnimationFrame(()=>requestAnimationFrame(check))}));document.querySelector('#page').addEventListener('change',e=>frame.src=e.target.value);document.querySelector('#check').addEventListener('click',check);</script></body></html>
